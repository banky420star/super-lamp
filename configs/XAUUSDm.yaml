asset_class: commodity
canary_policy:
  max_drawdown: 0.12
  min_realized_pnl: 0.0
  min_runtime_minutes: 45
  min_trades: 30
data:
  interval: 5m
  min_rows: 1000
  period: 60d
drl:
  batch_size: 512
  clip_range: 0.2
  ent_coef: 0.02   # Tier 0 profitability: slightly higher entropy to encourage exploration (was 0.005, contributed to flat collapse)
  feature_version: ultimate_150   # Tier 0: richer features; MTF support via multitimeframe_builder when data pipeline provides it
  gae_lambda: 0.95
  gamma: 0.995
  initial_balance: 10000.0
  learning_rate: 1e-4
  lstm_feature_extractor:
    features_dim: 256
    lstm_hidden: 128
    lstm_layers: 2
    portfolio_feature_count: 3
    window_size: 100
  n_envs: 4
  n_epochs: 10
  n_steps: 4096
  sde_sample_freq: 4
  target_kl: 0.01
  # Tier 0 profitability from FULL_STACK_PROFITABILITY_REVIEW.md:
  # - use_trend_momentum_bias: enabled by default in train_drl.py for XAU (momentum/trend as explicit layer before the rest)
  # - Clean dead columns (pattern_*, many cross_asset_*) are skipped in registry for this symbol
  # - Combined with 100% TradingReward primary (no more 80/20 dilution)
  use_trend_momentum_bias: true
  use_mtf: true   # prefer multitimeframe features when available (1m/5m/15m/1h)
  total_timesteps: 100000
  use_sde: true
lstm:
  batch_size: 64
  class_weights: auto
  dropout: 0.3
  early_stopping_patience: 7
  epochs: 50
  hidden_size: 128
  learning_rate: 0.001
  lr_factor: 0.5
  lr_patience: 3
  lr_scheduler: ReduceLROnPlateau
  num_layers: 3
  seq_len: 60
  volatility_thresholds:
    high: 0.003
    low: 0.001
risk:
  max_drawdown_pct: 5.0
  max_lots: 0.04
  min_lots: 0.01
  max_positions_per_symbol: 2
  max_spread_bps: 500
  max_slippage_points: 10
  cooldown_after_sl_minutes: 15
  cooldown_after_failed_signal_minutes: 5
  sl_atr_mult: 2.0
  tp_atr_mult: 2.0
  breakeven_risk_mult: 0.5
  quick_tp_risk_mult: 0.5
  quick_tp_close_pct: 0.33
  scale_out_1_risk_mult: 0.5
  scale_out_2_risk_mult: 1.0
  scale_out_3_risk_mult: 1.5
  scale_out_4_risk_mult: 2.0
  scale_out_5_risk_mult: 2.5
  scale_out_6_risk_mult: 3.0
  scale_out_7_risk_mult: 3.5
  scale_out_8_risk_mult: 4.0
  scale_out_9_risk_mult: 5.0
  scale_out_10_risk_mult: 6.0
  trailing_distance_atr: 0.6
  trailing_trigger_atr: 0.8
  profit_banding_pct: 0.25
symbol: XAUUSDm
timeframe: M5
trading_sessions:
  london: true
  new_york: true
  asian: true
