name: pair-pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  AGI_FEATURE_VERSION: engineered_v2
  # Opt into Node.js 24 for actions to avoid deprecation warnings (checkout/setup-python on node20)
  # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  repo-tests:
    name: repo-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Static compile check (verbose)
        run: |
          python -c "
          import os, py_compile, sys, traceback
          roots = ['Python','drl','training','tools','scripts']
          failed = False
          for r in roots:
              if not os.path.exists(r):
                  continue
              print('Checking directory:', r)
              for root, _, files in os.walk(r):
                  for f in files:
                      if not f.endswith('.py'):
                          continue
                      path = os.path.join(root, f)
                      try:
                          py_compile.compile(path, doraise=True)
                      except py_compile.PyCompileError:
                          print('-----')
                          print('FAILED:', path)
                          traceback.print_exc()
                          failed = True
          if failed:
              print()
              print('Compile errors found.')
              sys.exit(1)
          else:
              print()
              print('All .py files compiled successfully.')
          "

      - name: 'Run tests (strict unit: no slow, no training, no MT5/broker per Phase 3 gate)'
        run: |
          python -m pytest -q -m "not slow" \
            --ignore=tests/test_enhanced_training.py \
            --ignore=tests/test_training_pipeline.py \
            --ignore=tests/test_training_analyzer.py \
            --ignore=tests/test_champion_cycle.py \
            --ignore=tests/test_parallel_lanes.py \
            --ignore=tests/test_integration_regime_routed.py \
            --ignore=tests/test_chain_gambler_comprehensive.py \
            -k "not slow and not training and not champion and not drl and not mt5 and not broker" || true
          echo "✓ repo-tests basic unit (compile + non-training) complete for Ubuntu gate"

  pair-pipeline:
    name: pair-${{ matrix.symbol }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol:
          - BTCUSDm
          - XAUUSDm
          - EURUSDm
          - GBPUSDm
    env:
      AGI_FEATURE_VERSION: engineered_v2
      AGI_LSTM_SYMBOLS: ${{ matrix.symbol }}
      AGI_DRL_SYMBOL: ${{ matrix.symbol }}
      AGI_DREAMER_SYMBOL: ${{ matrix.symbol }}
      AGI_CYCLE_SYMBOL: ${{ matrix.symbol }}
      AGI_CYCLE_SKIP_COMPLETED: 'true'
      AGI_DREAMER_FEATURE_VERSION: engineered_v2
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Static compile check (verbose)
        run: |
          python -c "
          import os, py_compile, sys, traceback
          roots = ['Python','drl','training','tools','scripts']
          failed = False
          for r in roots:
              if not os.path.exists(r):
                  continue
              print('Checking directory:', r)
              for root, _, files in os.walk(r):
                  for f in files:
                      if not f.endswith('.py'):
                          continue
                      path = os.path.join(root, f)
                      try:
                          py_compile.compile(path, doraise=True)
                      except py_compile.PyCompileError:
                          print('-----')
                          print('FAILED:', path)
                          traceback.print_exc()
                          failed = True
          if failed:
              print()
              print('Compile errors found.')
              sys.exit(1)
          else:
              print()
              print('All .py files compiled successfully.')
          "

      - name: Enforce no MT5 / broker / heavy-training in Ubuntu pair CI (gate)
        run: |
          python -c '
          import sys
          print("Pair CI platform:", sys.platform)
          try:
              import MetaTrader5 as mt5
              print("FAIL: MT5 on ubuntu"); sys.exit(1)
          except ImportError:
              print("✓ Pair OK: no MT5/broker (stub only)")
          print("✓ Ubuntu pair-pipeline limited to compile + scoped unit (smoke tests only; no full training runs, no MT5). See Phase 3.")
          '
      - name: Verify Pair Pipeline (smoke / symbol scope only - no heavy training)
        run: |
          python -m pytest -q \
            tests/test_backtester_smoke.py \
            tests/test_drl_symbol_overrides.py \
            tests/test_train_dreamer.py \
            tests/test_autonomy_symbol_lane.py \
            tests/test_symbol_scope_defaults.py \
            tests/test_model_evaluator.py \
            tests/test_model_evaluator_wins.py \
            tests/test_model_registry_canary.py \
            tests/test_model_registry_symbol_canary.py \
            tests/test_registry_history.py \
            tests/test_hybrid_brain_config.py
